<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 多主题知识库</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e7ee; --ink:#1f2937; --ink2:#6b7280;
  --accent:#2563EB; --danger:#DC2626; --ok:#059669; --warn:#D97706;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);font-size:14px;line-height:1.6}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:16px;height:56px}
.hd h1{font-size:16px;margin:0;flex:0 0 auto}
.hd .sub{color:var(--ink2);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .link{color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{opacity:.88;background:var(--accent)}
.btn.danger{color:var(--danger);border-color:#f3c6c6}
.btn.danger:hover{background:#fef2f2}
.btn.ok{color:var(--ok);border-color:#bfe6d2}
.btn.ok:hover{background:#ecfdf5}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{display:none}
.panel.on{display:block}
#loginBox{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
#loginBox h2{margin:0 0 6px;font-size:18px}
#loginBox p{color:var(--ink2);font-size:13px;margin:0 0 18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.f textarea{min-height:120px;line-height:1.7;resize:vertical}
.f input[type=color]{height:38px;padding:2px;width:60px}
.msg{font-size:12.5px;color:var(--danger);min-height:18px;margin-top:8px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;width:220px;max-width:100%;font-family:inherit}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px;font-family:inherit;background:#fff}
.toolbar .chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);cursor:pointer}
.toolbar .lbl{font-size:12.5px;color:var(--ink2)}
.batch{display:flex;gap:8px;align-items:center;margin-bottom:10px;min-height:30px}
.batch .cnt{font-size:12.5px;color:var(--ink2)}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.note.hidden{opacity:.55;background:#fafafa}
.note .ck{margin-top:4px}
.note .body{flex:1;min-width:0}
.note .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.tag{font-size:11.5px;color:#fff;border-radius:20px;padding:1px 9px;white-space:nowrap}
.tag.tp{background:#334155}
.tag.hidden{background:#9ca3af}
.note .q{font-weight:600;font-size:14px;margin:0 0 2px;word-break:break-word}
.note .meta{font-size:12px;color:var(--ink2)}
.note .ops{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.note .ops .btn{margin-top:2px}
.note .preview{font-size:13px;color:var(--ink2);margin-top:4px;max-height:56px;overflow:hidden;word-break:break-word}
.formrow{display:grid;grid-template-columns:180px 1fr;gap:6px 10px;padding:10px 14px;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.formrow label{font-size:12px;color:var(--ink2);line-height:36px}
.formrow .err{grid-column:2;color:var(--danger);font-size:12px}
.formrow .fbtn{grid-column:2;display:flex;gap:8px;margin-top:6px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.img{position:relative;width:80px;height:80px}
.img img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.img .del{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.catrow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.catrow .f{flex:1;min-width:160px;margin:0}
.catrow .f label{font-size:11.5px}
.catrow .cnt{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.catrow .ops{display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .v{font-size:26px;font-weight:700;margin:2px 0 0}
.stat .l{font-size:12.5px;color:var(--ink2)}
.bars{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.bars h3{margin:0 0 12px;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .name{font-size:12.5px;width:120px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;background:#f1f3f7;border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;min-width:2px}
.bar .n{font-size:12px;color:var(--ink2);width:56px;flex:0 0 auto;text-align:right}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){
  .wrap{padding:14px}
  .toolbar input[type=text]{width:100%}
  .formrow{grid-template-columns:1fr}
  .formrow label{line-height:1.4}
  .note{flex-wrap:wrap}
  .note .ops{width:100%;justify-content:flex-start}
  .hd .sub{display:none}
}
</style>
</head>
<body>
<header class="hd">
  <h1>管理后台</h1>
  <span class="sub" id="whoami">未登录</span>
  <a class="link" href="index.html" target="_blank">打开前台 ↗</a>
  <button class="btn sm" id="logoutBtn" style="display:none">退出登录</button>
</header>

<div class="wrap" id="appBox" style="display:none">
  <nav class="tabs">
    <button class="tab on" data-tab="notes">笔记管理</button>
    <button class="tab" data-tab="cats">分类管理</button>
    <button class="tab" data-tab="stats">数据统计</button>
  </nav>

  <!-- 笔记管理 -->
  <section class="panel on" id="p-notes">
    <div class="toolbar">
      <input type="text" id="q" placeholder="搜索提问 / 答案…">
      <span class="lbl">主题</span>
      <select id="topicFilter"><option value="">全部主题</option></select>
      <select id="catFilter"><option value="">全部分类</option></select>
      <label class="chk"><input type="checkbox" id="showHidden"> 显示已隐藏</label>
      <button class="btn pri sm" id="addBtn">＋ 新增笔记</button>
    </div>
    <div class="batch">
      <label class="chk"><input type="checkbox" id="selAll"> 全选</label>
      <button class="btn sm" id="batchHide">隐藏选中</button>
      <button class="btn ok sm" id="batchShow">恢复选中</button>
      <span class="cnt" id="listCnt"></span>
    </div>
    <div id="noteList"></div>
  </section>

  <!-- 分类管理 -->
  <section class="panel" id="p-cats">
    <div class="toolbar">
      <span class="lbl">当前主题</span>
      <select id="catTopicFilter"></select>
      <button class="btn pri sm" id="addCatBtn">＋ 新增分类</button>
      <span class="cnt" id="catHint" style="font-size:12.5px;color:var(--ink2)">改名 / 改色后点「保存」，前台立即生效（分类按主题隔离）</span>
    </div>
    <div id="catList"></div>
  </section>

  <!-- 数据统计 -->
  <section class="panel" id="p-stats">
    <div class="stats" id="statCards"></div>
    <div class="bars" id="topicBars"><h3>主题分布</h3></div>
    <div class="bars" id="statBars"><h3>分类分布（当前主题）</h3></div>
    <div style="margin-top:14px">
      <button class="btn" id="exportBtn">导出全部数据（JSON）</button>
    </div>
  </section>
</div>

<div id="loginBox">
  <h2>管理员登录</h2>
  <p>仅管理员账号可进入后台。未注册请先注册并到邮箱点击确认链接。</p>
  <div class="f"><label>邮箱</label><input type="email" id="mEmail" autocomplete="email"></div>
  <div class="f"><label>密码</label><input type="password" id="mPw" autocomplete="current-password"></div>
  <button class="btn pri" id="mLogin" style="width:100%">登录</button>
  <button class="btn" id="mReg" style="width:100%;margin-top:8px">注册（首次使用）</button>
  <div class="msg" id="mMsg"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 基础 ===== */
const SUPABASE_URL = 'https://cecjcbvxgojpuynirtbq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlY2pjYnZ4Z29qcHV5bmlydGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzE5OTYsImV4cCI6MjEwNDgwNzk5Nn0.tFmY5dz4iwRr-P2GKfUT5HgEUMtWiMnndO5Jir0JOoE';
const ADMIN_EMAIL = 'shicai17@gmail.com';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 8 个主题（与前台一致） */
const TOPICS = [
  {id:'english', name:'英语学习', logo:'E'},
  {id:'tech',    name:'电脑数码', logo:'T'},
  {id:'work',    name:'工作商务', logo:'W'},
  {id:'car',     name:'车辆汽车', logo:'C'},
  {id:'health',  name:'健康医疗', logo:'H'},
  {id:'pet',     name:'养龟宠物', logo:'P'},
  {id:'life',    name:'生活家居', logo:'L'},
  {id:'arts',    name:'影视文艺', logo:'A'}
];
const TOPICMAP = {}; TOPICS.forEach(t=>TOPICMAP[t.id]=t);
const topicName = id => (TOPICMAP[id] ? TOPICMAP[id].name : (id||'未分类'));

let authUser = null;
let CATMAP = {};          // cat id -> {name,color,topic,sort,description}
let CATS_BY_TOPIC = {};    // topic -> [cat]
let NOTES = [];            // 全量笔记
let pendingImgs = [];
const CATS_DEFAULT = [
  {id:'sentence',name:'句子翻译',color:'#2563EB',topic:'english'},
  {id:'words',name:'单词与表达',color:'#0E9F6E',topic:'english'},
  {id:'grammar',name:'语法',color:'#D97706',topic:'english'},
  {id:'method',name:'学习方法',color:'#7C3AED',topic:'english'},
  {id:'speaking',name:'口语场景',color:'#DB2777',topic:'english'},
  {id:'culture',name:'语言文化',color:'#0891B2',topic:'english'},
  {id:'exam',name:'考试水平',color:'#4D7C0F',topic:'english'},
  {id:'other',name:'英语杂谈',color:'#64748B',topic:'english'}
];
CATS_DEFAULT.forEach(c=>CATMAP[c.id]=c);
CATS_BY_TOPIC = {english: CATS_DEFAULT.slice()};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function isAdmin(){ return !!(authUser && authUser.email === ADMIN_EMAIL); }
function imgPathFromUrl(u){
  const i = u.indexOf('/object/public/note-images/');
  if(i < 0) return null;
  try{ return decodeURIComponent(u.slice(i + '/object/public/note-images/'.length)); }catch(e){ return null; }
}
function fmtDate(d){ return (d||'').slice(0,10); }
function curTopic(){ return $('topicFilter').value; }          // 空=全部主题
function curCatTopic(){ return $('catTopicFilter').value; }   // 分类管理当前主题

/* ===== 登录 ===== */
function setMsg(t){ $('mMsg').textContent = t; }
async function submitAuth(mode){
  const email = $('mEmail').value.trim();
  const pw = $('mPw').value;
  if(!email || !pw){ setMsg('请填写邮箱和密码'); return; }
  setMsg('');
  const fn = mode === 'login' ? sb.auth.signInWithPassword : sb.auth.signUp;
  const {data, error} = await fn({email: email, password: pw});
  if(error){ setMsg(error.message); return; }
  if(mode === 'signup'){ setMsg('注册成功，请到邮箱点击确认链接后重新登录'); return; }
  await boot();
}
function logout(){ sb.auth.signOut().then(()=>{ location.reload(); }); }

/* ===== 数据加载 ===== */
async function loadCategories(){
  try{
    const {data, error} = await sb.from('categories').select('id,name,color,sort,description,topic').order('sort');
    if(!error && data && data.length){
      CATMAP = {}; CATS_BY_TOPIC = {};
      data.forEach(c=>{
        const tp = c.topic || 'english';
        CATMAP[c.id] = {id: c.id, name:c.name, color:c.color, topic:tp, sort:c.sort, description:c.description||''};
        (CATS_BY_TOPIC[tp] = CATS_BY_TOPIC[tp] || []).push(CATMAP[c.id]);
      });
      TOPICS.forEach(t=>{
        CATS_BY_TOPIC[t.id] = CATS_BY_TOPIC[t.id] || [];
        CATS_BY_TOPIC[t.id].sort((a,b)=>(a.sort==null?99:a.sort)-(b.sort==null?99:b.sort));
      });
    }
  }catch(e){}
}
async function loadNotes(){
  const all = [];
  const PAGE = 1000;
  for(let from = 0; ; from += PAGE){
    const {data, error} = await sb.from('notes').select('id,q,body,cat,date,images,topic').order('id').range(from, from + PAGE - 1);
    if(error){ toast('加载失败：' + error.message); return; }
    all.push.apply(all, data || []);
    if(!data || data.length < PAGE) break;
  }
  NOTES = all;
  fillTopicFilters();
  fillCatFilter();
  renderNotes();
  renderCats();
  renderStats();
}

/* ===== 下拉填充 ===== */
function fillTopicFilters(){
  const tf = $('topicFilter');
  const cur = tf.value;
  tf.innerHTML = '<option value="">全部主题</option>' + TOPICS.map(t=>'<option value="'+t.id+'">'+t.logo+' '+t.name+'</option>').join('');
  if([...tf.options].some(o=>o.value===cur)) tf.value = cur;
  const cf = $('catTopicFilter');
  const curc = cf.value || 'english';
  cf.innerHTML = TOPICS.map(t=>'<option value="'+t.id+'"'+(t.id===curc?' selected':'')+'>'+t.logo+' '+t.name+'</option>').join('');
}

/* ===== 笔记列表 ===== */
function currentFilter(){
  const q = $('q').value.trim().toLowerCase();
  const topic = curTopic();
  const cat = $('catFilter').value;
  const showHidden = $('showHidden').checked;
  return NOTES.filter(n=>{
    if(n.deleted && !showHidden) return false;
    if(topic && (n.topic||'english') !== topic) return false;
    if(cat && n.cat !== cat) return false;
    if(q && (n.q||'').toLowerCase().indexOf(q) < 0 && (n.body||'').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function fillCatFilter(){
  const sel = $('catFilter');
  const cur = sel.value;
  const topic = curTopic();
  const pool = topic ? (CATS_BY_TOPIC[topic]||[]) : Object.keys(CATMAP).map(k=>CATMAP[k]);
  sel.innerHTML = '<option value="">全部分类</option>' +
    pool.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===cur?' selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function renderNotes(){
  const list = currentFilter();
  const box = $('noteList');
  $('listCnt').textContent = '共 ' + list.length + ' 条（含已隐藏 ' + list.filter(n=>n.deleted).length + '）';
  if(!list.length){ box.innerHTML = '<div style="color:var(--ink2);padding:30px;text-align:center">没有符合条件的笔记</div>'; return; }
  box.innerHTML = list.map(n=>{
    const cat = CATMAP[n.cat] || {name: n.cat||'未分类', color:'#9ca3af'};
    const imgs = (n.images||[]).length;
    const tp = n.topic||'english';
    return '<div class="note'+(n.deleted?' hidden':'')+'" data-id="'+n.id+'">'
      + '<input type="checkbox" class="ck" data-id="'+n.id+'">'
      + '<div class="body">'
      + '<div class="top"><span class="tag tp">'+esc(topicName(tp))+'</span>'
      + '<span class="tag" style="background:'+esc(cat.color)+'">'+esc(cat.name)+'</span>'
      + '<span class="meta">'+fmtDate(n.date)+'</span>'
      + (imgs ? '<span class="meta">图片 '+imgs+' 张</span>' : '')
      + (n.deleted ? '<span class="tag hidden">已隐藏</span>' : '')
      + '</div>'
      + '<div class="q">'+esc(n.q)+'</div>'
      + '<div class="preview">'+esc((n.body||'').slice(0,120))+(n.body && n.body.length>120?'…':'')+'</div>'
      + '</div>'
      + '<div class="ops">'
      + '<button class="btn sm" data-act="edit" data-id="'+n.id+'">编辑</button>'
      + (n.deleted
          ? '<button class="btn ok sm" data-act="show" data-id="'+n.id+'">恢复显示</button>'
          : '<button class="btn sm" data-act="hide" data-id="'+n.id+'">隐藏</button>')
      + '</div></div>';
  }).join('');
}

/* ===== 图片上传 ===== */
function renderImgList(listEl){
  listEl.innerHTML = '';
  pendingImgs.forEach((img, idx)=>{
    const w = document.createElement('div');
    w.className = 'img';
    w.innerHTML = '<img src="'+esc(img.url)+'" alt="预览">';
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '×';
    del.addEventListener('click', ()=>{
      if(img.isNew){ const p = imgPathFromUrl(img.url); if(p) sb.storage.from('note-images').remove([p]); }
      pendingImgs.splice(idx, 1);
      renderImgList(listEl);
    });
    w.appendChild(del);
    listEl.appendChild(w);
  });
}
async function handleUpload(fileInput, listEl){
  const files = Array.from(fileInput.files || []);
  fileInput.value = '';
  if(!authUser) return;
  for(const f of files){
    if(f.size > 5*1024*1024){ toast('「'+f.name+'」超过 5MB，已跳过'); continue; }
    if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){ toast('「'+f.name+'」不是 jpg/png/webp/gif，已跳过'); continue; }
    const safe = f.name.replace(/[^\w.\-]/g, '_').slice(-60);
    const path = authUser.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '-' + safe;
    const {error} = await sb.storage.from('note-images').upload(path, f, {contentType: f.type});
    if(error){ toast('上传失败：' + error.message); continue; }
    const {data} = sb.storage.from('note-images').getPublicUrl(path);
    pendingImgs.push({url: data.publicUrl, isNew: true});
    renderImgList(listEl);
  }
}

/* ===== 编辑 / 新增（含主题与分类联动） ===== */
function catOptionsFor(tp, selected){
  const pool = (CATS_BY_TOPIC[tp] && CATS_BY_TOPIC[tp].length) ? CATS_BY_TOPIC[tp] : Object.keys(CATMAP).map(k=>CATMAP[k]);
  return pool.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function topicOptions(selected){
  return TOPICS.map(t=>'<option value="'+t.id+'"'+(t.id===selected?' selected':'')+'>'+t.logo+' '+t.name+'</option>').join('');
}
function editForm(n, isNew){
  pendingImgs = (n.images || []).map(u=>({url: u, isNew: false}));
  const nTopic = n.topic || 'english';
  const row = document.createElement('div');
  row.className = 'formrow';
  row.innerHTML =
    '<label>提问 *</label><input type="text" id="fQ" value="'+esc(n.q||'')+'">'
    + '<label>主题</label><select id="fTopic">'+topicOptions(nTopic)+'</select>'
    + '<label>分类</label><select id="fCat">'+catOptionsFor(nTopic, n.cat)+'</select>'
    + '<label>答案 *（支持 **加粗**、### 小标题、- 列表）</label><textarea id="fBody">'+esc(n.body||'')+'</textarea>'
    + '<label>图片（单张 ≤5MB）</label>'
    + '<div><div class="imgs" id="fImgs"></div>'
    + '<input type="file" id="fFile" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:none">'
    + '<button type="button" class="btn sm" id="fUp">＋ 上传图片</button></div>'
    + '<div class="err" id="fErr"></div>'
    + '<div class="fbtn"><button class="btn pri" id="fSave">'+(isNew?'新增':'保存')+'</button>'
    + '<button class="btn" id="fCancel">取消</button></div>';
  const listEl = row.querySelector('#fImgs');
  renderImgList(listEl);
  row.querySelector('#fUp').addEventListener('click', ()=> row.querySelector('#fFile').click());
  row.querySelector('#fFile').addEventListener('change', ()=> handleUpload(row.querySelector('#fFile'), listEl));
  // 主题切换 → 级联刷新分类下拉
  row.querySelector('#fTopic').addEventListener('change', e=>{
    const tp = e.target.value;
    row.querySelector('#fCat').innerHTML = catOptionsFor(tp, '');
  });
  row.querySelector('#fCancel').addEventListener('click', ()=> row.remove());
  row.querySelector('#fSave').addEventListener('click', async ()=>{
    const q = row.querySelector('#fQ').value.trim();
    const body = row.querySelector('#fBody').value;
    const topic = row.querySelector('#fTopic').value;
    const cat = row.querySelector('#fCat').value;
    const err = row.querySelector('#fErr');
    if(!q || !body.trim()){ err.textContent = '提问和答案都不能为空'; return; }
    if(!cat){ err.textContent = '请选择分类'; return; }
    err.textContent = '';
    const newUrls = pendingImgs.map(x=>x.url);
    const removed = ((n.images||[]).filter(u=>newUrls.indexOf(u)<0));
    for(const u of removed){
      const p = imgPathFromUrl(u);
      if(p) await sb.storage.from('note-images').remove([p]);
    }
    const payload = {q: q, body: body, cat: cat, topic: topic, images: newUrls};
    const {error} = isNew
      ? await sb.from('notes').insert(payload)
      : await sb.from('notes').update(payload).eq('id', n.id);
    if(error){ err.textContent = '保存失败：' + error.message; return; }
    pendingImgs = [];
    row.remove();
    toast(isNew ? '已新增' : '已保存');
    await loadNotes();
  });
  return row;
}
function openEdit(id){
  const n = NOTES.find(x=>x.id === id);
  if(!n) return;
  const row = editForm(n, false);
  $('noteList').prepend(row);
}
function openNew(){
  const tp = curTopic() || 'english';
  const pool = (CATS_BY_TOPIC[tp]&&CATS_BY_TOPIC[tp].length) ? CATS_BY_TOPIC[tp] : [];
  const row = editForm({q:'', body:'', topic:tp, cat:(pool[0]?pool[0].id:''), images:[]}, true);
  $('noteList').prepend(row);
}

/* ===== 批量操作 ===== */
function selectedIds(){
  return Array.from(document.querySelectorAll('#noteList .ck:checked')).map(c=>parseInt(c.dataset.id,10));
}
async function batchSet(deleted){
  const ids = selectedIds();
  if(!ids.length){ toast('请先勾选笔记'); return; }
  const {error} = await sb.from('notes').update({deleted: deleted}).in('id', ids);
  if(error){ toast('操作失败：' + error.message); return; }
  toast(deleted ? '已隐藏 ' + ids.length + ' 条' : '已恢复 ' + ids.length + ' 条');
  await loadNotes();
}

/* ===== 分类管理（按主题隔离） ===== */
function renderCats(){
  const box = $('catList');
  const tp = curCatTopic();
  const cnt = {};
  NOTES.forEach(n=>{ const c = n.topic||'english'; cnt[n.cat] = (cnt[n.cat]||0) + 1; });
  const ids = (CATS_BY_TOPIC[tp]||[]).map(c=>c.id);
  if(!ids.length){ box.innerHTML = '<div style="color:var(--ink2);padding:20px">「'+esc(topicName(tp))+'」主题下暂无分类，点上方「＋ 新增分类」创建</div>'; return; }
  box.innerHTML = ids.map(id=>{
    const c = CATMAP[id];
    const n = cnt[id] || 0;
    return '<div class="catrow" data-id="'+esc(id)+'">'
      + '<div class="f" style="max-width:180px"><label>英文标识（不可改）</label><input type="text" value="'+esc(id)+'" disabled style="background:#f3f4f6"></div>'
      + '<div class="f" style="max-width:180px"><label>显示名称</label><input type="text" class="cname" value="'+esc(c.name)+'"></div>'
      + '<div class="f" style="max-width:110px"><label>颜色</label><input type="color" class="ccolor" value="'+esc(c.color)+'"></div>'
      + '<span class="cnt">'+n+' 条笔记</span>'
      + '<div class="ops">'
      + '<button class="btn sm pri" data-act="catsave" data-id="'+esc(id)+'">保存</button>'
      + (n === 0 ? '<button class="btn sm danger" data-act="catdel" data-id="'+esc(id)+'">删除</button>' : '')
      + '</div></div>';
  }).join('');
}
function catRow(id){ return document.querySelector('.catrow[data-id="'+esc(id)+'"]'); }
async function saveCat(id){
  const row = catRow(id);
  if(!row) return;
  const name = row.querySelector('.cname').value.trim();
  const color = row.querySelector('.ccolor').value;
  if(!name){ toast('名称不能为空'); return; }
  const {error} = await sb.from('categories').update({name: name, color: color}).eq('id', id);
  if(error){ toast('保存失败：' + error.message); return; }
  await loadCategories();
  renderCats();
  fillCatFilter();
  renderStats();
  toast('分类已保存，前台已生效');
}
async function deleteCat(id){
  const n = NOTES.filter(x=>x.cat===id).length;
  if(n > 0){ toast('该分类下还有 '+n+' 条笔记，不能删除'); return; }
  if(!confirm('确定删除分类「' + (CATMAP[id]||{}).name + '」？')) return;
  const {error} = await sb.from('categories').delete().eq('id', id);
  if(error){ toast('删除失败：' + error.message); return; }
  await loadCategories();
  renderCats();
  fillCatFilter();
  toast('已删除分类');
}
function openNewCat(){
  const tp = curCatTopic();
  const row = document.createElement('div');
  row.className = 'catrow';
  row.innerHTML =
    '<div class="f" style="max-width:180px"><label>英文标识（小写字母，如 idiom）</label><input type="text" class="nid" placeholder="idiom"></div>'
    + '<div class="f" style="max-width:180px"><label>显示名称</label><input type="text" class="nname" placeholder="习语表达"></div>'
    + '<div class="f" style="max-width:110px"><label>颜色</label><input type="color" class="ncolor" value="#64748B"></div>'
    + '<span class="cnt">归属主题：'+esc(topicName(tp))+'</span>'
    + '<div class="ops"><button class="btn sm pri" id="nSave">新增</button>'
    + '<button class="btn sm" id="nCancel">取消</button></div>';
  row.querySelector('#nCancel').addEventListener('click', ()=> row.remove());
  row.querySelector('#nSave').addEventListener('click', async ()=>{
    const id = row.querySelector('.nid').value.trim().toLowerCase();
    const name = row.querySelector('.nname').value.trim();
    const color = row.querySelector('.ncolor').value;
    const errMsg = !id ? '请填写英文标识' : (!name ? '请填写显示名称' : null);
    if(errMsg){ toast(errMsg); return; }
    if(!/^[a-z][a-z0-9_]*$/.test(id)){ toast('英文标识只能是小写字母/数字/下划线'); return; }
    if(CATMAP[id]){ toast('该标识已存在'); return; }
    const {error} = await sb.from('categories').insert({id: id, name: name, color: color, sort: 99, topic: tp});
    if(error){ toast('新增失败：' + error.message); return; }
    await loadCategories();
    row.remove();
    renderCats();
    fillCatFilter();
    renderStats();
    toast('已新增分类（可编辑笔记时选择）');
  });
  $('catList').prepend(row);
  row.querySelector('.nid').focus();
}

/* ===== 统计 ===== */
function renderStats(){
  const total = NOTES.length;
  const shown = NOTES.filter(n=>!n.deleted).length;
  const hidden = total - shown;
  const imgCnt = NOTES.reduce((s,n)=> s + (n.images||[]).length, 0);
  $('statCards').innerHTML =
    '<div class="stat"><div class="l">全部笔记</div><div class="v">'+total+'</div></div>'
    + '<div class="stat"><div class="l">显示中</div><div class="v">'+shown+'</div></div>'
    + '<div class="stat"><div class="l">已隐藏</div><div class="v">'+hidden+'</div></div>'
    + '<div class="stat"><div class="l">图片总数</div><div class="v">'+imgCnt+'</div></div>'
    + '<div class="stat"><div class="l">分类数</div><div class="v">'+Object.keys(CATMAP).length+'</div></div>';
  // 主题分布
  const tcnt = {};
  NOTES.forEach(n=>{ const tp = n.topic||'english'; tcnt[tp]=(tcnt[tp]||0)+1; });
  const tmax = Math.max(1, ...TOPICS.map(t=>tcnt[t.id]||0));
  $('topicBars').innerHTML = '<h3>主题分布</h3>' + TOPICS.map(t=>{
    const n = tcnt[t.id]||0;
    return '<div class="bar"><span class="name">'+t.logo+' '+esc(t.name)+'</span>'
      + '<div class="track"><div class="fill" style="width:'+(n/tmax*100).toFixed(1)+'%;background:'+(t.id==='english'?'#1E4FD8':'#64748B')+'"></div></div>'
      + '<span class="n">'+n+'</span></div>';
  }).join('');
  // 分类分布（当前分类管理主题）
  const tp = curCatTopic();
  const cnt = {};
  NOTES.forEach(n=>{ cnt[n.cat] = (cnt[n.cat]||0) + 1; });
  const ids = (CATS_BY_TOPIC[tp]||[]).map(c=>c.id);
  const max = Math.max(1, ...ids.map(id=>cnt[id]||0));
  $('statBars').innerHTML = '<h3>分类分布（'+esc(topicName(tp))+'）</h3>' + ids.map(id=>{
    const c = CATMAP[id], n = cnt[id]||0;
    return '<div class="bar"><span class="name">'+esc(c.name)+'</span>'
      + '<div class="track"><div class="fill" style="width:'+(n/max*100).toFixed(1)+'%;background:'+esc(c.color)+'"></div></div>'
      + '<span class="n">'+n+'</span></div>';
  }).join('');
}

/* ===== 导出 ===== */
function exportData(){
  const data = {exported_at: new Date().toISOString(), total: NOTES.length, notes: NOTES};
  const blob = Blob ? new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}) : null;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'knowledge-base-export-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 ' + NOTES.length + ' 条');
}

/* ===== 事件 ===== */
$('mLogin').addEventListener('click', ()=> submitAuth('login'));
$('mReg').addEventListener('click', ()=> submitAuth('signup'));
$('logoutBtn').addEventListener('click', logout);
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id === 'p-'+t.dataset.tab));
  });
});
$('q').addEventListener('input', renderNotes);
$('topicFilter').addEventListener('change', ()=>{ fillCatFilter(); renderNotes(); });
$('catFilter').addEventListener('change', renderNotes);
$('showHidden').addEventListener('change', renderNotes);
$('catTopicFilter').addEventListener('change', ()=>{ renderCats(); renderStats(); });
$('selAll').addEventListener('change', e=>{
  document.querySelectorAll('#noteList .ck').forEach(c=>{ c.checked = e.target.checked; });
});
$('batchHide').addEventListener('click', ()=> batchSet(true));
$('batchShow').addEventListener('click', ()=> batchSet(false));
$('addBtn').addEventListener('click', openNew);
$('addCatBtn').addEventListener('click', openNewCat);
$('exportBtn').addEventListener('click', exportData);
document.getElementById('noteList').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const id = parseInt(btn.dataset.id, 10);
  if(btn.dataset.act === 'edit') openEdit(id);
  else if(btn.dataset.act === 'hide') batchSetById([id], true);
  else if(btn.dataset.act === 'show') batchSetById([id], false);
});
document.getElementById('catList').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const id = btn.dataset.id;
  if(btn.dataset.act === 'catsave') saveCat(id);
  else if(btn.dataset.act === 'catdel') deleteCat(id);
});
async function batchSetById(ids, deleted){
  const {error} = await sb.from('notes').update({deleted: deleted}).in('id', ids);
  if(error){ toast('操作失败：' + error.message); return; }
  toast(deleted ? '已隐藏' : '已恢复');
  await loadNotes();
}

/* ===== 启动 ===== */
async function boot(){
  await loadCategories();
  await loadNotes();
  if(isAdmin()){
    $('appBox').style.display = 'block';
    $('loginBox').style.display = 'none';
    $('whoami').textContent = authUser.email + '（管理员）';
    $('logoutBtn').style.display = '';
  }else{
    $('appBox').style.display = 'none';
    $('loginBox').style.display = 'block';
    $('whoami').textContent = authUser ? authUser.email + '（无权限）' : '未登录';
    $('logoutBtn').style.display = authUser ? '' : 'none';
    if(authUser){ setMsg('该账号不是管理员，无法进入后台'); }
  }
}
sb.auth.getSession().then(({data})=>{
  authUser = data.session ? data.session.user : null;
  boot();
});
sb.auth.onAuthStateChange((_e, session)=>{
  authUser = session ? session.user : null;
  boot();
});
</script>
</body>
</html>
