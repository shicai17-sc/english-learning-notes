<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多主题知识库 · 学习手册</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>

:root{
  --paper:#FAF7F1; --paper2:#F1EBE0; --ink:#23272F; --ink2:#5B6472; --line:#E3DCCE;
  --accent:#1E4FD8; --serif:'Noto Serif SC',Georgia,'Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
::selection{background:#FDE68A}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,247,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .25s}
.brand b{font-weight:700}
.searchbox{flex:1;min-width:200px;max-width:420px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.searchbox svg{flex:none;opacity:.5}
.searchbox input{border:none;outline:none;background:transparent;width:100%;font-size:14px;font-family:var(--sans)}
.top-actions{display:flex;gap:8px}
.top-actions button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:6px 14px;font-size:13px;font-family:var(--sans)}
.top-actions button:hover{border-color:var(--accent);color:var(--accent)}
.search-stat{font-size:12px;color:var(--ink2);min-width:120px;text-align:right}
/* ===== 主题 tab 栏 ===== */
.topicbar{max-width:1280px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px 12px}
.topic{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 14px;font-size:13px;font-family:var(--sans);transition:all .15s}
.topic:hover{border-color:var(--accent);color:var(--accent)}
.topic.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* ===== 布局 ===== */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:264px 1fr;gap:36px;padding:8px 24px 80px}
/* ===== 侧栏 ===== */
.sidebar{position:sticky;top:140px;align-self:start;height:calc(100vh - 150px);overflow:auto;padding-right:8px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.side-topic{font-family:var(--serif);font-weight:800;font-size:16px;margin:4px 0 2px;color:var(--ink)}
.side-topic-desc{font-size:12px;color:var(--ink2);margin-bottom:12px;line-height:1.65}
.side-title{font-size:12px;letter-spacing:.12em;color:var(--ink2);margin:18px 0 10px;font-weight:600}
.side-nav{list-style:none;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.side-nav li{border-bottom:1px solid var(--line)}
.side-nav li:last-child{border-bottom:none}
.side-nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.side-nav a:hover{background:var(--paper2)}
.side-nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.side-nav .cnt{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.side-foot{font-size:12px;color:var(--ink2);margin-top:16px;line-height:1.7}
/* ===== 主区 ===== */
.hero{padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.hero h1{font-family:var(--serif);font-size:28px;font-weight:900;letter-spacing:.01em}
.hero .sub{color:var(--ink2);margin-top:4px;font-size:13px;max-width:640px}
.hero-stats{display:flex;gap:0;margin-top:10px;flex-wrap:wrap}
.hstat{flex:1;min-width:90px;padding:6px 14px 6px 0;border-right:1px solid var(--line)}
.hstat:last-child{border-right:none}
.hstat .num{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.hstat .lb{font-size:11px;color:var(--ink2);margin-top:1px}
.distrip{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px;max-width:640px}
.distrip i{display:block;height:100%}
/* ===== 章节 ===== */
section.cat{margin-top:40px;scroll-margin-top:140px}
.cat-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.cat-no{font-family:var(--serif);font-size:15px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:2px 8px;transform:translateY(2px)}
.cat-head h2{font-family:var(--serif);font-size:24px;font-weight:800}
.cat-head .cn{font-size:13px;color:var(--ink2);font-weight:400}
.cat-count{font-size:12px;color:var(--ink2);margin-left:auto;white-space:nowrap}
/* ===== 条目 ===== */
.entry{position:relative;padding:16px 0 16px 18px;border-bottom:1px solid var(--line);scroll-margin-top:140px}
.entry::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:2px;background:var(--ec)}
.entry.hide{display:none}
.entry:hover{background:rgba(255,255,255,.6)}
.e-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.e-date{font-variant-numeric:tabular-nums;white-space:nowrap}
.e-chip{color:#fff;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--ec);white-space:nowrap}
.e-dup{background:var(--paper2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.e-q{font-size:15.5px;font-weight:700;line-height:1.65;margin-bottom:8px}
.e-a{font-size:14px;color:#333A46;line-height:1.8;overflow-wrap:break-word}
.e-a h3{font-size:13.5px;margin:12px 0 4px;color:var(--ink);font-weight:700}
.e-a h2{font-size:14.5px;margin:12px 0 4px;color:var(--ink);font-weight:700}
.e-a p{margin:4px 0}
.e-a ul,.e-a ol{margin:4px 0 4px 22px}
.e-a li{margin:2px 0}
.e-a blockquote{border-left:3px solid var(--line);color:var(--ink2);padding:2px 12px;margin:6px 0;background:var(--paper2)}
.e-a code{background:var(--paper2);border-radius:4px;padding:1px 5px;font-size:13px}
.fu{margin-top:10px;border-left:3px solid var(--line);padding-left:14px;color:#3E4654}
.fu .fu-q{font-size:13.5px;font-weight:600;margin-bottom:6px}
.fu .fu-q::before{content:'追问 ';font-size:11px;color:var(--ink2);font-weight:400}
.fu .e-a{font-size:13.5px}
.e-more{display:none}
.e-more.on{display:block}
.btn-more{cursor:pointer;margin-top:8px;border:none;background:none;color:var(--accent);font-size:13px;font-family:var(--sans);padding:0}
.btn-more:hover{text-decoration:underline}
mark{background:#FDE68A;color:inherit;border-radius:2px;padding:0 1px}
.empty{display:none;text-align:center;color:var(--ink2);padding:60px 0;font-size:14px}
.empty.show{display:block}
.totop{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:60}
.totop.show{display:flex}
.e-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.e-btn{cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:8px;padding:5px 11px;font-size:12.5px;font-family:var(--sans);line-height:1}
.e-btn svg{width:13px;height:13px;flex:none}
.e-btn:hover{border-color:var(--accent);color:var(--accent)}
.e-btn.del:hover{border-color:#DC2626;color:#DC2626}
.e-edit{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper2)}
.ee-field{margin-bottom:10px}
.ee-field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.ee-field input,.ee-field textarea,.ee-field select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink)}
.ee-field select{cursor:pointer;height:40px}
.ee-field textarea{min-height:160px;line-height:1.7;resize:vertical}
.e-edit-actions{display:flex;gap:8px;justify-content:flex-end}
.e-edit-actions .save{background:var(--accent);border-color:var(--accent);color:#fff}
.e-edit-actions .save:hover{opacity:.88;color:#fff;background:var(--accent)}
.side-tools{margin-top:12px}
.side-tools button{width:100%;cursor:pointer;border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:var(--sans)}
.side-tools button:hover{border-color:var(--accent);color:var(--accent)}
.loading{text-align:center;color:var(--ink2);padding:50px 0;font-size:14px}
.e-actions .e-btn{display:none}
body.is-admin .e-actions .e-btn{display:inline-flex}
.auth-tip{font-size:12px;color:var(--ink2);line-height:1.7;background:var(--paper2);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.auth-tip b{color:var(--accent)}
.modal-mask{position:fixed;inset:0;background:rgba(35,39,47,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-mask[hidden]{display:none}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.m-title{font-family:var(--serif);font-size:18px;font-weight:800}
.m-sub{font-size:12.5px;color:var(--ink2);margin:6px 0 14px;line-height:1.6}
.modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:var(--sans);margin-bottom:10px;background:#fff}
.modal input:focus{outline:none;border-color:var(--accent)}
.m-msg{font-size:12.5px;color:#B45309;min-height:18px;margin-bottom:8px;line-height:1.5}
.m-actions{display:flex;gap:8px}
.m-actions button{flex:1;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:8px;padding:8px 0;font-size:13.5px;font-family:var(--sans)}
.m-actions button:hover{border-color:var(--accent);color:var(--accent)}
.m-actions #mLogin{background:var(--accent);border-color:var(--accent);color:#fff}
.m-actions #mLogin:hover{opacity:.88;color:#fff}
.e-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.e-images img{width:128px;height:128px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.ee-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ee-img{position:relative;width:96px;height:96px}
.ee-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.ee-img-del{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#DC2626;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ee-img-del:hover{background:#FEE2E2}
.ee-upload-row{margin-top:2px}
.ee-upload-row .ee-upload{cursor:pointer;border:1px dashed var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:6px 14px;font-size:12.5px;font-family:var(--sans)}
.ee-upload-row .ee-upload:hover{background:#EFF4FF}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:92%;max-height:92%;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
@media(max-width:960px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .sidebar{position:static;top:auto;height:auto;max-height:340px;margin-bottom:8px}
  .topbar-in{padding:10px 14px 0}
  .topicbar{padding:8px 14px 10px}
  .hero h1{font-size:22px}
  .cat-head h2{font-size:20px}
}
@media(max-width:560px){
  .hstat .num{font-size:15px}
  .search-stat{display:none}
  .entry{padding-left:12px}
  .searchbox input{font-size:16px}
  .top-actions button{min-height:44px;padding:6px 16px}
  .hstat .lb{font-size:11px}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
.login-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-gate .lg-box{width:340px;max-width:90vw;padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.login-gate .lg-logo{font-size:28px;text-align:center;margin-bottom:4px}
.login-gate h2{font-family:var(--serif);font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.login-gate .lg-sub{font-size:13px;color:var(--ink2);text-align:center;margin-bottom:22px;line-height:1.5}
.login-gate input{width:100%;padding:11px 13px;margin-bottom:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;box-sizing:border-box;background:var(--bg)}
.login-gate input:focus{outline:none;border-color:var(--accent)}
.login-gate .lg-msg{font-size:12px;color:var(--accent);min-height:18px;margin-bottom:8px;text-align:center}
.login-gate .lg-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.login-gate .lg-btn:hover{opacity:.88}
.login-gate .lg-foot{font-size:11px;color:var(--ink3);text-align:center;margin-top:16px}
body.logged-in .login-gate{display:none}
body:not(.logged-in) .topbar,body:not(.logged-in) .layout{display:none}

</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <div class="lg-box">
    <div class="lg-logo">📚</div>
    <h2>多主题知识库</h2>
    <div class="lg-sub">本网站需登录后查看内容<br>请输入已授权的邮箱和密码</div>
    <input id="lgEmail" type="email" placeholder="邮箱" autocomplete="email">
    <input id="lgPw" type="password" placeholder="密码" autocomplete="current-password">
    <div class="lg-msg" id="lgMsg"></div>
    <button class="lg-btn" id="lgLogin">登录</button>
    <div class="lg-foot">没有账号？请联系管理员开通</div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo" id="brandLogo">E</span><b id="brandName">英语学习手册</b></div>
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="搜索单词、句子、主题…" autocomplete="off">
    </div>
    <div class="top-actions">
      <button id="openAll">全部展开</button>
      <button id="closeAll">全部收起</button>
      <button id="loginBtn">管理员登录</button>
    </div>
    <span class="search-stat" id="searchStat"></span>
  </div>
  <nav class="topicbar" id="topicbar"></nav>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="hero">
      <h1 id="heroTitle">英语学习手册</h1>
      <p class="sub" id="heroSub">从两年对话中筛选的英语学习问答，按主题整理成精炼笔记。</p>
      <div class="hero-stats">
        <div class="hstat"><div class="num" id="statTotal">1226</div><div class="lb">精炼问答</div></div>
        <div class="hstat"><div class="num" id="statCats">8</div><div class="lb">子分类</div></div>
        <div class="hstat"><div class="num" id="statSpan">"2024-07-31 ~ 2026-09-07"</div><div class="lb">对话覆盖区间</div></div>
      </div>
      <div class="distrip" id="distrip"></div>
    </div>
    <div id="main"></div>
    <div class="loading" id="loading">正在从云端加载笔记…</div>
    <div class="empty" id="empty">没有匹配的内容，换个关键词试试。</div>
  </main>
</div>

<button class="totop" id="totop" aria-label="返回顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 15 7-7 7 7"/></svg>
</button>

<div class="modal-mask" id="authModal" hidden>
  <div class="modal">
    <div class="m-title">管理员登录</div>
    <div class="m-sub">仅管理员邮箱 <b>shicai17@gmail.com</b> 可修改/删除笔记，其他访客只读。首次使用请先注册该邮箱（需到邮箱点击确认链接）。</div>
    <input id="mEmail" type="email" placeholder="邮箱" autocomplete="email">
    <input id="mPw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <div class="m-msg" id="mMsg"></div>
    <div class="m-actions">
      <button id="mLogin">登录</button>
      <button id="mReg">注册</button>
      <button id="mClose">关闭</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 主题与云端接入 ===== */
const TOPICS = [{"id": "english", "name": "英语学习", "logo": "E", "title": "英语学习手册", "accent": "#1E4FD8", "sub": "从两年对话中筛选的英语学习问答：单词、语法、口语、翻译，去掉寒暄与重复，按主题整理成精炼笔记。带 ▾ 的长答案可展开看全文。", "placeholder": "搜索单词、句子、主题…"}, {"id": "tech", "name": "电脑数码", "logo": "T", "title": "电脑数码手册", "accent": "#0D9488", "sub": "电脑、手机、网络、软件、智能家电与数码设备相关的问答笔记。", "placeholder": "搜索设备、软件、故障…"}, {"id": "work", "name": "工作商务", "logo": "W", "title": "工作商务手册", "accent": "#6D28D9", "sub": "职场沟通、项目管理、合同邮件、海外工作与商务协作相关问答。", "placeholder": "搜索会议、合同、出差…"}, {"id": "car", "name": "车辆汽车", "logo": "C", "title": "车辆汽车手册", "accent": "#C2410C", "sub": "购车选车、保养维修、自驾出行等车辆相关问答。", "placeholder": "搜索车型、保养、故障…"}, {"id": "health", "name": "健康医疗", "logo": "H", "title": "健康医疗手册", "accent": "#059669", "sub": "日常健康、就医体检、用药与运动健身相关问答。", "placeholder": "搜索症状、用药、检查…"}, {"id": "pet", "name": "养龟宠物", "logo": "P", "title": "养龟宠物手册", "accent": "#92400E", "sub": "养龟、猫狗、水族与其他宠物的饲养护理问答。", "placeholder": "搜索龟、猫、狗、饲养…"}, {"id": "life", "name": "生活家居", "logo": "L", "title": "生活家居手册", "accent": "#BE185D", "sub": "家居家电、清洁维修、做饭收纳等日常生活问答。", "placeholder": "搜索家电、维修、菜谱…"}, {"id": "arts", "name": "影视文艺", "logo": "A", "title": "影视文艺手册", "accent": "#4F46E5", "sub": "电影、电视剧、音乐、书籍等文艺作品赏析相关问答。", "placeholder": "搜索电影、音乐、书籍…"}];

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inlineFormat(s){
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdRender(t){
  t = esc(t);
  const lines = t.split('\n');
  let html = '', list = null;
  const closeList = ()=>{ if(list){ html += (list==='ul'?'</ul>':'</ol>'); list=null; } };
  for(let ln of lines){
    const s = ln.trim();
    if(!s){ closeList(); continue; }
    let m = s.match(/^#{1,3}\s+(.*)$/);
    if(m){ closeList(); const lv = (s.match(/^#+/)||[''])[0].length; const tag = lv<=1?'h2':'h3';
      html += '<'+tag+'>'+inlineFormat(m[1])+'</'+tag+'>'; continue; }
    m = s.match(/^[-*]\s+(.*)$/);
    if(m){ if(list!=='ul'){ closeList(); html+='<ul>'; list='ul'; } html += '<li>'+inlineFormat(m[1])+'</li>'; continue; }
    m = s.match(/^\d+[.、)]\s+(.*)$/);
    if(m){ if(list!=='ol'){ closeList(); html+='<ol>'; list='ol'; } html += '<li>'+inlineFormat(m[1])+'</li>'; continue; }
    m = s.match(/^>\s?(.*)$/);
    if(m){ closeList(); html += '<blockquote>'+inlineFormat(m[1])+'</blockquote>'; continue; }
    closeList(); html += '<p>'+inlineFormat(s)+'</p>';
  }
  closeList();
  return html;
}
const TRUNC = 420;
function truncHTML(t){
  const cut = t.slice(0, TRUNC);
  let idx = Math.max(cut.lastIndexOf('\n### '), cut.lastIndexOf('\n## '), cut.lastIndexOf('\n\n'));
  const s = idx > TRUNC*0.5 ? cut.slice(0, idx) : cut;
  return mdRender(s) + '<p>……</p>';
}

/* ===== 图片：上传 / 预览 / 移除 ===== */
let pendingImgs = [];
function imgPathFromUrl(u){
  const i = u.indexOf('/object/public/note-images/');
  if(i < 0) return null;
  try{ return decodeURIComponent(u.slice(i + '/object/public/note-images/'.length)); }catch(e){ return null; }
}
function renderImgList(id, listEl){
  listEl.innerHTML = '';
  pendingImgs.forEach((img, idx)=>{
    const w = document.createElement('div');
    w.className = 'ee-img';
    w.innerHTML = '<img src="'+esc(img.url)+'" alt="图片预览">';
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'ee-img-del'; del.title = '移除这张图'; del.setAttribute('aria-label','移除');
    del.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    del.addEventListener('click', ()=>{
      if(img.isNew){ const p = imgPathFromUrl(img.url); if(p) sb.storage.from('note-images').remove([p]); }
      pendingImgs.splice(idx, 1);
      renderImgList(id, listEl);
    });
    w.appendChild(del);
    listEl.appendChild(w);
  });
}
async function handleUpload(id, input, listEl){
  const files = Array.from(input.files || []);
  input.value = '';
  if(!authUser) return;
  for(const f of files){
    if(f.size > 5*1024*1024){ alert('「'+f.name+'」超过 5MB，已跳过'); continue; }
    if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){ alert('「'+f.name+'」不是 jpg/png/webp/gif，已跳过'); continue; }
    const safe = f.name.replace(/[^\w.\-]/g, '_').slice(-60);
    const path = authUser.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + safe;
    const {error} = await sb.storage.from('note-images').upload(path, f, {contentType: f.type});
    if(error){ alert('上传失败：' + error.message); continue; }
    const {data} = sb.storage.from('note-images').getPublicUrl(path);
    pendingImgs.push({url: data.publicUrl, isNew: true});
    renderImgList(id, listEl);
  }
}

async function doSave(id){

  const newUrls = pendingImgs.map(x=>x.url);
  const removed = (DATA[id].images || []).filter(u => newUrls.indexOf(u) < 0);

async function restoreDeleted(){
  const del = DATA.filter(it=>it.__deleted);
  const n = del.length;
  if(!n) return;
  if(!confirm('恢复全部已删除的 ' + n + ' 条笔记？')) return;
  const ids = del.map(it=>it.__dbid);
  const {error} = await sb.from('notes').update({deleted: false}).in('id', ids);
  if(error){ alert('恢复失败：' + error.message); return; }
  del.forEach(it=>{ it.__deleted = false; });
  renderAll();
}
function exportData(){
  const eff = (notesByTopic[currentTopic]||[]).map(it=>({topic: currentTopic, date: it.date, cat: it.cat, q: it.q, body: it.body, fups: it.fups||[], dup: it.dup||[]}));
  const blob = new Blob([JSON.stringify(eff, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentTopic + '-notes.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); }, 5000);
}

/* ===== 云端数据加载与实时同步 ===== */
async function loadCategories(){
  try{
    const {data, error} = await sb.from('categories').select('id,name,color,sort,description,topic').order('sort');
    if(!error && data && data.length){
      CATMAP = {}; CATS_BY_TOPIC = {};
      data.forEach(c=>{
        const tp = c.topic || 'english';
        CATMAP[c.id] = {id: c.id, name: c.name, color: c.color, topic: tp, sort: c.sort, description: c.description||''};
        (CATS_BY_TOPIC[tp] = CATS_BY_TOPIC[tp] || []).push(CATMAP[c.id]);
      });
      TOPICS.forEach(t=>{
        CATS_BY_TOPIC[t.id] = CATS_BY_TOPIC[t.id] || [];
        CATS_BY_TOPIC[t.id].sort((a,b)=> (a.sort==null?99:a.sort) - (b.sort==null?99:b.sort));
      });
    }
  }catch(e){ /* 回退内置分类 */ }
}
async function loadNotes(){
  await loadCategories();
  const box = document.getElementById('loading');
  if(box) box.style.display = 'block';
  const all = [];
  const PAGE = 1000;
  for(let from = 0; ; from += PAGE){
    const {data, error} = await sb.from('notes').select('*').order('id').range(from, from + PAGE - 1);
    if(error){
      if(box){ box.textContent = '云端加载失败：' + error.message + '（请检查网络后刷新）'; box.style.display = 'block'; }
      return;
    }
    all.push.apply(all, data || []);
    if(!data || data.length < PAGE) break;
  }
  DATA.length = 0;
  all.forEach(r=>{
    const o = {date: r.date||'', q: r.q, body: r.body, cat: r.cat, fups: r.fups||[], dup: r.dup||[], images: r.images||[], topic: r.topic||'english'};
    o.__dbid = r.id;
    o.__deleted = !!r.deleted;
    DATA.push(o);
  });
  if(box) box.style.display = 'none';
  renderAll();
  updateAuthUI();
}

function isAdmin(){ return !!(authUser && authUser.email === ADMIN_EMAIL); }
function openAuthModal(){ document.getElementById('authModal').hidden = false; document.getElementById('mMsg').textContent=''; document.getElementById('mEmail').focus(); }
function closeAuthModal(){ document.getElementById('authModal').hidden = true; }
async function submitAuth(mode){
  const email = document.getElementById('mEmail').value.trim();
  const pw = document.getElementById('mPw').value;
  const msg = document.getElementById('mMsg');
  if(!email || !pw){ msg.textContent = '请填写邮箱和密码'; return; }
  if(pw.length < 6){ msg.textContent = '密码至少 6 位'; return; }
  msg.textContent = '处理中…';
  if(mode === 'login'){
    const {error} = await sb.auth.signInWithPassword({email: email, password: pw});
    if(error){ msg.textContent = '登录失败：' + error.message; return; }
    closeAuthModal();
  } else {
    const {data, error} = await sb.auth.signUp({email: email, password: pw});
    if(error){ msg.textContent = '注册失败：' + error.message; return; }
    if(data.session){ closeAuthModal(); }
    else { msg.textContent = '注册成功，请到邮箱点击确认链接后重新登录。'; }
  }
}

  cats.forEach(c=>{
    const n = (byCat[c.id]||[]).length;
    h += '<li><a href="#cat-'+c.id+'"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'<span class="cnt">'+n+'</span></a></li>';
  });
  h += '</ul>';
  const eff = notesByTopic[currentTopic]||[];
  h += '<div class="side-foot">共 <b id="sideTotal">'+eff.length+'</b> 条问答</div>';
  h += '<div class="side-tools"><div class="auth-tip" id="authTip"></div></div>';
  if(isAdmin() && deletedCount() > 0){
    h += '<div class="side-tools"><button type="button" id="restoreBtn">已删 '+deletedCount()+' 条 · 恢复</button></div>';
  }
  h += '<div class="side-tools"><button type="button" id="exportBtn">导出当前主题数据(JSON)</button></div>';
  document.getElementById('sidebar').innerHTML = h;
  const rb = document.getElementById('restoreBtn');
  if(rb) rb.addEventListener('click', restoreDeleted);
  document.getElementById('exportBtn').addEventListener('click', exportData);
}
function buildMain(){
  const cats = CATS_BY_TOPIC[currentTopic] || [];
  const list = searchResults || (notesByTopic[currentTopic] || []);
  const byCatF = {};
  list.forEach(it=>{ (byCatF[it.cat]=byCatF[it.cat]||[]).push(it); });
  let h = '';
  let rendered = 0;
  cats.forEach((c, i)=>{
    const items = byCatF[c.id]||[];
    h += '<section class="cat" id="cat-'+c.id+'"><div class="cat-head"><span class="cat-no">'+String(i+1).padStart(2,'0')+'</span><h2>'+esc(c.name)+'</h2><span class="cn">'+esc(c.description||'')+'</span><span class="cat-count">'+items.length+' 条</span></div>';
    items.forEach(it=>{
      if(rendered < visibleCount){ h += entryHTML(it, c.color, it.__id); rendered++; }
    });
    h += '</section>';
  });
  if(rendered < list.length){
    h += '<div id="loadMoreTip" style="text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;">已显示 '+rendered+' / '+list.length+' 条 · 向下滚动加载更多</div>';
  }
  document.getElementById('main').innerHTML = h;
}
function refreshStats(){
  const eff = notesByTopic[currentTopic]||[];
  const cats = CATS_BY_TOPIC[currentTopic]||[];
  const t = document.getElementById('statTotal'); if(t) t.textContent = eff.length;
  const st = document.getElementById('sideTotal'); if(st) st.textContent = eff.length;
  const sc = document.getElementById('statCats'); if(sc) sc.textContent = cats.length;
  const dates = eff.map(x=>x.date).filter(Boolean).sort();
  const sp = document.getElementById('statSpan');
  if(sp) sp.textContent = dates.length ? (dates[0]+' ~ '+dates[dates.length-1]) : '—';
  const distrip = document.getElementById('distrip');
  const total = eff.length || 1;
  let dh = '';
  cats.forEach(c=>{
    const n = (byCat[c.id]||[]).length;
    if(n) dh += '<i style="width:'+(n/total*100).toFixed(2)+'%;background:'+c.color+'" title="'+esc(c.name)+' '+n+'"></i>';
  });
  distrip.innerHTML = dh;
}
function renderAll(){
  rebuildByCat();
  renderTopicBar();
  updateTopicUI();
  buildSidebar();
  visibleCount = INITIAL_VISIBLE;
  searchResults = null;
  buildMain();
  refreshStats();
  collectEntries();
  applyFilter(currentQuery);
}
function switchTopic(t){
  if(!TOPICMAP[t]) return;
  if(t === currentTopic) return;
  currentTopic = t;
  currentQuery = '';
  const qs = document.getElementById('q'); if(qs) qs.value = '';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ===== 搜索与折叠 ===== */
let allEntries = [];
function collectEntries(){
  allEntries = Array.from(document.querySelectorAll('#main .entry'));
  allEntries.forEach(el=>{
    el.__it = {cat: el.dataset.cat, q: el.querySelector('.e-q').textContent, body: el.querySelector('.e-a').textContent, fups: []};
  });
}
function highlightAll(q){
  if(!q) return;
  document.querySelectorAll('#main .entry').forEach(el=> highlight(el, q));
}
function applyFilter(q){
  q = (q||'').trim().toLowerCase();
  currentQuery = q;
  if(q){
    const all = notesByTopic[currentTopic] || [];
    searchResults = all.filter(it=> (it.q+' '+it.body).toLowerCase().indexOf(q) >= 0);
  } else {
    searchResults = null;
  }
  visibleCount = INITIAL_VISIBLE;
  buildMain();
  collectEntries();
  const total = searchResults ? searchResults.length : (notesByTopic[currentTopic]||[]).length;
  document.getElementById('searchStat').textContent = q ? ('匹配 ' + total + ' 条') : ('共 ' + total + ' 条');
  document.getElementById('empty').classList.toggle('show', total===0 && !!q);
  highlightAll(q);
}
function highlight(el, q){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode(n){ return n.parentNode.tagName==='MARK' ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const idx = n.textContent.toLowerCase().indexOf(q);
    if(idx<0) return;
    const span = document.createElement('span');
    span.appendChild(document.createTextNode(n.textContent.slice(0,idx)));
    const mark = document.createElement('mark');
    mark.textContent = n.textContent.slice(idx, idx+q.length);
    span.appendChild(mark);
    span.appendChild(document.createTextNode(n.textContent.slice(idx+q.length)));
    n.parentNode.replaceChild(span, n);
  });
}
function toggleMore(btn){
  const card = btn.closest('.e-a');
  const on = card.querySelector('.e-more'), off = card.querySelector('.e-more-off');
  const isOpen = on.classList.contains('on');
  on.classList.toggle('on');
  off.style.display = isOpen ? '' : 'none';
  btn.textContent = isOpen ? '展开全部 ▾' : '收起 ▲';
}
function toggleAll(open){
  allEntries.forEach(el=>{
    const m = el.querySelector('.e-more');
    if(m){
      m.classList.toggle('on', open);
      const off = el.querySelector('.e-more-off');
      if(off) off.style.display = open ? 'none' : '';
      const b = el.querySelector('.btn-more');
      if(b) b.textContent = open ? '收起 ▲' : '展开全部 ▾';
    }
  });
}

/* ===== 事件 ===== */
function onMainClick(e){
  const save = e.target.closest('[data-save]');
  if(save){ doSave(parseInt(save.dataset.save, 10)); return; }
  const cancel = e.target.closest('[data-cancel]');
  if(cancel){ cancelEdit(parseInt(cancel.dataset.cancel, 10)); return; }
  const more = e.target.closest('.btn-more');
  if(more){ toggleMore(more); return; }
  const big = e.target.closest('.e-images img');
  if(big){
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = '<img src="'+esc(big.dataset.big)+'" alt="放大预览">';
    lb.addEventListener('click', ()=> lb.remove());
    document.body.appendChild(lb);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const id = parseInt(btn.dataset.id, 10);
  if(btn.dataset.act === 'del'){ doDelete(id); return; }
  if(btn.dataset.act === 'edit'){ enterEdit(id, btn.closest('.entry')); }
}
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('main').addEventListener('click', onMainClick);
  document.getElementById('topicbar').addEventListener('click', e=>{
    const b = e.target.closest('.topic');
    if(b) switchTopic(b.dataset.topic);
  });
  document.getElementById('q').addEventListener('input', e=>{ currentQuery = e.target.value; applyFilter(currentQuery); });
  document.getElementById('openAll').addEventListener('click', ()=> toggleAll(true));
  document.getElementById('closeAll').addEventListener('click', ()=> toggleAll(false));
  document.getElementById('loginBtn').addEventListener('click', ()=>{ if(isAdmin()) logout(); });
  document.getElementById('mLogin').addEventListener('click', ()=> submitAuth('login'));
  document.getElementById('mClose').addEventListener('click', closeAuthModal);
  document.getElementById('authModal').addEventListener('click', e=>{ if(e.target.id === 'authModal') closeAuthModal(); });
  // 全屏登录门
  async function doGateLogin(){
    const email = document.getElementById('lgEmail').value.trim();
    const pw = document.getElementById('lgPw').value;
    const msg = document.getElementById('lgMsg');
    if(!email || !pw){ msg.textContent = '请填写邮箱和密码'; return; }
    msg.textContent = '登录中…';
    const {error} = await sb.auth.signInWithPassword({email, password: pw});
    if(error){ msg.textContent = '登录失败：' + error.message; return; }
    msg.textContent = '';
  }
  document.getElementById('lgLogin').addEventListener('click', doGateLogin);
  document.getElementById('lgPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doGateLogin(); });
  document.getElementById('lgEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lgPw').focus(); });
  const totop = document.getElementById('totop');
  totop.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
  let _scrollTimer = null;
  window.addEventListener('scroll', ()=>{
    totop.classList.toggle('show', window.scrollY > 800);
    if(_scrollTimer) return;
    _scrollTimer = setTimeout(()=>{
      _scrollTimer = null;
      const list = searchResults || (notesByTopic[currentTopic]||[]);
      if(visibleCount >= list.length) return;
      if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 700){
        const sy = window.scrollY;
        visibleCount += LOAD_BATCH;
        buildMain();
        collectEntries();
        highlightAll(currentQuery);
        window.scrollTo(0, sy);
      }
    }, 120);
  });
  updateAuthUI();
  loadNotes();
});
</script>
